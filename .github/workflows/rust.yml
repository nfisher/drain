name: Rust

on:
  push:
    branches: [main]
    paths:
      - "rust-app/**"
      - ".github/workflows/rust.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "rust-app/**"
      - ".github/workflows/rust.yml"
      - ".github/workflows/release.yml"
  workflow_call:
    inputs:
      ref:
        description: Release tag to check out and build
        required: true
        type: string
    outputs:
      has_app:
        description: Whether the selected revision contains the Rust app
        value: ${{ jobs.dependencies.outputs.has_app }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  dependencies:
    name: Resolve Rust dependencies
    runs-on: ubuntu-26.04
    outputs:
      has_app: ${{ steps.app.outputs.exists }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Check for Rust app
        id: app
        run: |
          if [[ -f rust-app/Cargo.toml ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This revision predates the Rust app; skipping Rust builds."
          fi

      - name: Install Rust
        if: steps.app.outputs.exists == 'true'
        run: rustup toolchain install stable --profile minimal

      - name: Resolve dependencies once for all platforms
        if: steps.app.outputs.exists == 'true'
        working-directory: rust-app
        run: |
          if [[ ! -f Cargo.lock ]]; then
            cargo generate-lockfile
          fi

      - name: Save dependency lockfile
        if: steps.app.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: polars-app-lockfile
          path: rust-app/Cargo.lock
          if-no-files-found: error

  build:
    name: Rust ${{ matrix.platform }}
    needs: dependencies
    if: needs.dependencies.outputs.has_app == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            platform: linux-amd64
            target: x86_64-unknown-linux-gnu
            extension: ""
          - os: macos-15
            platform: osx-arm64
            target: aarch64-apple-darwin
            extension: ""
          - os: windows-2025
            platform: windows-amd64
            target: x86_64-pc-windows-msvc
            extension: ".exe"
    defaults:
      run:
        working-directory: rust-app
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}

      - name: Restore dependency lockfile
        uses: actions/download-artifact@v7
        with:
          name: polars-app-lockfile
          path: rust-app

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Run release binary
        run: ./target/${{ matrix.target }}/release/polars-app${{ matrix.extension }}

      - name: Stage binary
        run: |
          mkdir -p ../dist
          cp "target/${{ matrix.target }}/release/polars-app${{ matrix.extension }}" \
            "../dist/polars-app-${{ matrix.platform }}${{ matrix.extension }}"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: polars-app-${{ matrix.platform }}
          path: dist/polars-app-${{ matrix.platform }}${{ matrix.extension }}
          if-no-files-found: error
