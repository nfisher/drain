name: Go
run-name: "${{ github.event.head_commit.message || github.event.pull_request.title || format('Go {0} by @{1}', github.ref_name, github.actor) }}"

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go and systemd dependencies
        uses: ./.github/actions/setup-go-systemd

      - name: Run tests with race detector and coverage
        run: go test -race -v -covermode=atomic -coverprofile=coverage.out ./...

      - name: Run no-cgo tests
        run: CGO_ENABLED=0 go test ./...

      - name: Report coverage
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          {
            echo "### Coverage"
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5

  security:
    name: Security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go and systemd dependencies
        uses: ./.github/actions/setup-go-systemd

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        id: run_govulncheck
        run: |
          set +e
          govulncheck ./... 2>&1 | tee govulncheck.txt
          status=${PIPESTATUS[0]}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        id: run_gosec
        run: |
          set +e
          gosec ./... 2>&1 | tee gosec.txt
          text_status=${PIPESTATUS[0]}
          gosec -fmt sarif -out gosec.sarif ./...
          sarif_status=$?

          echo "text_status=${text_status}" >> "$GITHUB_OUTPUT"
          echo "sarif_status=${sarif_status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload security text reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-text-reports
          path: |
            govulncheck.txt
            gosec.txt
          if-no-files-found: warn

      - name: Upload gosec SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif

      - name: Fail security scan on findings
        if: always()
        run: |
          govuln_status="${{ steps.run_govulncheck.outputs.status }}"
          gosec_text_status="${{ steps.run_gosec.outputs.text_status }}"
          gosec_sarif_status="${{ steps.run_gosec.outputs.sarif_status }}"

          failed=0
          if [ "${govuln_status:-1}" -ne 0 ]; then
            echo "govulncheck failed with status ${govuln_status:-missing}"
            failed=1
          fi
          if [ "${gosec_text_status:-1}" -ne 0 ]; then
            echo "gosec text report failed with status ${gosec_text_status:-missing}"
            failed=1
          fi
          if [ "${gosec_sarif_status:-1}" -ne 0 ]; then
            echo "gosec SARIF report failed with status ${gosec_sarif_status:-missing}"
            failed=1
          fi
          exit "$failed"

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check out main for benchmark comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          ref: main
          path: benchmark-main

      - name: Set up Go and systemd dependencies
        uses: ./.github/actions/setup-go-systemd

      - name: Run main benchmarks
        if: github.event_name == 'pull_request'
        working-directory: benchmark-main
        run: go test -run='^$' -bench=. -benchmem -count=10 ./... | tee ../benchmarks-main.txt

      - name: Run pull request benchmarks
        if: github.event_name == 'pull_request'
        run: go test -run='^$' -bench=. -benchmem -count=10 ./... | tee benchmarks-pr.txt

      - name: Compare benchmarks
        if: github.event_name == 'pull_request'
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          benchstat benchmarks-main.txt benchmarks-pr.txt | tee benchmarks-comparison.txt

      - name: Run benchmarks
        if: github.event_name != 'pull_request'
        run: go test -run='^$' -bench=. -benchmem -count=10 ./... | tee benchmarks.txt

      - name: Report benchmark comparison
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "### Benchmark comparison (main → pull request)"
            echo '```'
            cat benchmarks-comparison.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report benchmarks
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Benchmarks"
            echo '```'
            cat benchmarks.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          path: |
            benchmarks.txt
            benchmarks-main.txt
            benchmarks-pr.txt
            benchmarks-comparison.txt
