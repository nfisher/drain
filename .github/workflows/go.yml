name: Go
run-name: "${{ github.event.head_commit.message || github.event.pull_request.title || format('Go {0} by @{1}', github.ref_name, github.actor) }}"

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  race-test:
    name: Race test (CGO/systemd)
    # Keep the OS generation explicit so a future runner image migration does
    # not unexpectedly change the CGO toolchain. The setup action reuses
    # runner-provided packages and installs only dependencies this image lacks.
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          save-build: 'true'
          build-mode: race-coverage

      - name: Set up systemd dependencies
        uses: ./.github/actions/setup-go-systemd

      - name: Run tests with race detector and coverage
        run: go test -race -v -covermode=atomic -coverprofile=coverage.out ./...

      - name: Report coverage
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          {
            echo "### Coverage"
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt

  no-cgo:
    name: No-CGO build
    runs-on: ubuntu-26.04
    env:
      CGO_ENABLED: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          save-modules: 'true'
          save-build: 'true'

      - name: Build without CGO
        run: go build ./...

      - name: Test unsupported systemd implementation
        run: go test ./internal/parseio -run '^TestSystemdSourceUnsupportedBackendReturnsClearError$'

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-26.04
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5

  security:
    name: Security scan
    runs-on: ubuntu-26.04
    env:
      # Share the no-CGO build cache as a restore-only consumer.
      CGO_ENABLED: "0"
      GOSEC_VERSION: v2.29.0
      GOVULNCHECK_VERSION: v1.8.0
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Cache security tools
        id: cache-security-tools
        uses: actions/cache@v5
        with:
          path: |
            ~/go/bin/gosec
            ~/go/bin/govulncheck
          key: ${{ runner.os }}-security-tools-${{ runner.arch }}-cgo-${{ env.CGO_ENABLED }}-gosec-${{ env.GOSEC_VERSION }}-govulncheck-${{ env.GOVULNCHECK_VERSION }}

      - name: Install security tools
        if: steps.cache-security-tools.outputs.cache-hit != 'true'
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          go install "github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION}"

      - name: Run govulncheck
        id: run_govulncheck
        continue-on-error: true
        shell: bash
        run: govulncheck ./... 2>&1 | tee govulncheck.txt

      - name: Run gosec and generate text and SARIF reports
        id: run_gosec
        continue-on-error: true
        shell: bash
        # Scan once: save SARIF to disk and print the same results as text.
        run: gosec -fmt sarif -out gosec.sarif -stdout -verbose text ./... 2>&1 | tee gosec.txt

      - name: Upload security text reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-text-reports
          path: |
            govulncheck.txt
            gosec.txt
          if-no-files-found: warn

      - name: Upload gosec SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: gosec.sarif

      - name: Fail security scan on findings
        # Upload reports before failing, and treat skipped scans as failures too.
        if: |
          always() && (
            steps.run_govulncheck.outcome != 'success' ||
            steps.run_gosec.outcome != 'success'
          )
        run: |
          echo "::error::One or more security scans failed or did not run. See the scan steps and uploaded reports."
          exit 1

  benchmark:
    name: Benchmark
    runs-on: ubuntu-26.04
    env:
      # A statistically significant increase above this percentage in any of
      # the suite's time or allocation metrics is considered a regression.
      BENCHMARK_REGRESSION_THRESHOLD: "10"
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Find latest successful main benchmark
        if: github.event_name == 'pull_request'
        id: main_benchmark
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh api \
            --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/go.yml/runs" \
            -f branch=main \
            -f event=push \
            -f status=success \
            -f per_page=1 \
            --jq '.workflow_runs[0].id')
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download main benchmark
        if: github.event_name == 'pull_request'
        uses: actions/download-artifact@v7
        with:
          name: benchmarks
          path: benchmark-main
          github-token: ${{ github.token }}
          run-id: ${{ steps.main_benchmark.outputs.run_id }}

      - name: Prepare main benchmark
        if: github.event_name == 'pull_request'
        run: mv benchmark-main/benchmarks.txt benchmarks-main.txt

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          save-build: 'true'

      - name: Set up systemd dependencies
        uses: ./.github/actions/setup-go-systemd

      - name: Run benchmarks
        env:
          BENCHMARK_FILE: ${{ github.event_name == 'pull_request' && 'benchmarks-pr.txt' || 'benchmarks.txt' }}
        shell: bash
        run: go test -run='^$' -bench=. -benchmem -count=5 ./... | tee "$BENCHMARK_FILE"

      - name: Compare benchmarks
        if: github.event_name == 'pull_request'
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          benchstat benchmarks-main.txt benchmarks-pr.txt | tee benchmarks-comparison.txt

      - name: Report benchmark comparison
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "### Benchmark comparison (main → pull request)"
            echo '```'
            cat benchmarks-comparison.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce benchmark regression threshold
        if: github.event_name == 'pull_request'
        run: |
          awk -v threshold="$BENCHMARK_REGRESSION_THRESHOLD" '
            {
              for (field = 1; field <= NF; field++) {
                if ($field ~ /^\+[0-9]+([.][0-9]+)?%$/) {
                  change = $field
                  gsub(/[+%]/, "", change)
                  if (change + 0 > threshold) {
                    print "Benchmark regression exceeds " threshold "%: " $0
                    failed = 1
                  }
                }
              }
            }
            END { exit failed }
          ' benchmarks-comparison.txt

      - name: Report benchmarks
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Benchmarks"
            echo '```'
            cat benchmarks.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmarks
          retention-days: 90
          if-no-files-found: ignore
          path: |
            benchmarks.txt
            benchmarks-main.txt
            benchmarks-pr.txt
            benchmarks-comparison.txt
