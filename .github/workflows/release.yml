name: Release

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload assets to
        required: true

permissions:
  actions: read
  contents: write
  id-token: write
  packages: write

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-26.04
    outputs:
      should_release: ${{ steps.tag.outputs.should_release }}
      tag_name: ${{ steps.tag.outputs.tag_name }}

    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            push)
              tag="$GITHUB_REF_NAME"
              if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "::notice::Tag '$tag' does not match vY.Y.Y; skipping release"
                echo "should_release=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
            release)
              tag="$RELEASE_TAG"
              ;;
            workflow_dispatch)
              tag="$INPUT_TAG"
              ;;
            *)
              echo "::error::Unsupported event '$GITHUB_EVENT_NAME'"
              exit 1
              ;;
          esac

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: github.event_name == 'push' && steps.tag.outputs.should_release == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.tag.outputs.tag_name }}
        run: gh release create "$TAG_NAME" --verify-tag --title "$TAG_NAME" --generate-notes

  # Keep Linux and non-Linux builds independent: the container only needs Linux.
  build-linux:
    name: Build Linux binaries
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ needs.prepare-release.outputs.tag_name }}
      targets: >-
        [
          {"goos": "linux", "goarch": "amd64", "asset_name": "cluster-linux-amd64"},
          {"goos": "linux", "goarch": "arm64", "asset_name": "cluster-linux-arm64"}
        ]

  build-non-linux:
    name: Build non-Linux binaries
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ needs.prepare-release.outputs.tag_name }}
      targets: >-
        [
          {"goos": "darwin", "goarch": "arm64", "asset_name": "cluster-osx-arm64"},
          {"goos": "windows", "goarch": "amd64", "asset_name": "cluster-windows-amd64.exe"},
          {"goos": "windows", "goarch": "arm64", "asset_name": "cluster-windows-arm64.exe"}
        ]

  build-rust:
    name: Build Linux Rust binary
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    uses: ./.github/workflows/rust.yml
    with:
      ref: ${{ needs.prepare-release.outputs.tag_name }}
      linux_only: true
    permissions:
      contents: read

  upload-rust:
    name: Upload Rust release assets
    runs-on: ubuntu-26.04
    needs:
      - prepare-release
      - build-rust
    if: needs.build-rust.outputs.has_app == 'true'
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download Rust artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: polars-app-*
          path: dist
          merge-multiple: true

      - name: Upload Linux binary and dependency lockfile
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
        run: |
          mv dist/Cargo.lock dist/polars-app-Cargo.lock
          gh release upload "$TAG_NAME" dist/polars-app-linux-amd64 dist/polars-app-Cargo.lock --clobber

  sbom:
    name: Generate release SBOM
    runs-on: ubuntu-26.04
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Prepare SBOM output directory
        run: mkdir -p dist

      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          artifact-name: cluster-source.spdx.json
          output-file: dist/cluster-source.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false

      - name: Upload source SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-source-sbom
          path: dist/cluster-source.spdx.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload source SBOM to release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/cluster-source.spdx.json --clobber

  sign-release-assets:
    name: Sign release assets
    runs-on: ubuntu-26.04
    needs:
      - prepare-release
      - build-linux
      - build-non-linux
      - build-rust
      - upload-rust
      - sbom
    # Older tags have no Rust app; their skipped Rust jobs must not block Go signing.
    if: >-
      always() && !cancelled() &&
      needs.prepare-release.outputs.should_release == 'true' &&
      needs.build-linux.result == 'success' &&
      needs.build-non-linux.result == 'success' &&
      needs.sbom.result == 'success' &&
      (needs.build-rust.result == 'success' || needs.build-rust.result == 'skipped') &&
      (needs.upload-rust.result == 'success' || needs.upload-rust.result == 'skipped')
    permissions:
      actions: read
      contents: write
      id-token: write

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: cluster-*
          path: dist
          merge-multiple: true

      - name: Download Rust artifacts
        if: needs.upload-rust.result == 'success'
        uses: actions/download-artifact@v7
        with:
          pattern: polars-app-*
          path: dist
          merge-multiple: true

      - name: Name Rust dependency lockfile
        if: needs.upload-rust.result == 'success'
        run: mv dist/Cargo.lock dist/polars-app-Cargo.lock

      - name: Download source SBOM artifact
        uses: actions/download-artifact@v7
        with:
          name: release-source-sbom
          path: dist

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4

      - name: Sign release assets
        run: |
          while IFS= read -r -d '' asset; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "${asset}"
          done < <(find dist -maxdepth 1 -type f ! -name '*.sigstore.json' -print0 | sort -z)

      - name: Upload signatures to release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/*.sigstore.json --clobber

  container:
    name: Build container
    runs-on: ubuntu-26.04
    needs:
      - prepare-release
      - build-linux
    if: needs.prepare-release.outputs.should_release == 'true'

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Resolve container metadata
        id: metadata
        env:
          GH_REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
        run: |
          repository="${GH_REPOSITORY,,}"
          owner="${repository%%/*}"
          repo="${repository#*/}"
          version_base="${TAG_NAME#v}"
          short_sha="$(git rev-parse --short=12 HEAD)"
          build_version="${version_base}+${short_sha}"
          image="ghcr.io/${owner}/${repo}-cluster"

          {
            echo "build_version=${build_version}"
            echo "full_sha=$(git rev-parse HEAD)"
            echo "image=${image}"
            echo "release_url=https://github.com/${GH_REPOSITORY}/releases/tag/${TAG_NAME}"
            echo "short_sha=${short_sha}"
            echo "version_base=${version_base}"
          } >> "$GITHUB_OUTPUT"

      - name: Download Linux binary artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: cluster-linux-*
          path: dist
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push container
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.metadata.outputs.image }}:${{ needs.prepare-release.outputs.tag_name }}
            ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.version_base }}
            ${{ steps.metadata.outputs.image }}:latest
          labels: |
            org.opencontainers.image.title=Drain cluster CLI
            org.opencontainers.image.description=Drain cluster CLI
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=${{ steps.metadata.outputs.release_url }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.build_version }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.full_sha }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4

      - name: Sign container image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: |
            ${{ steps.metadata.outputs.image }}:${{ needs.prepare-release.outputs.tag_name }}
            ${{ steps.metadata.outputs.image }}:${{ steps.metadata.outputs.version_base }}
            ${{ steps.metadata.outputs.image }}:latest
        run: |
          images=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              images+=("${tag}@${DIGEST}")
            fi
          done <<< "$TAGS"
          cosign sign --yes "${images[@]}"

      - name: Generate container SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ steps.metadata.outputs.image }}@${{ steps.build.outputs.digest }}
          artifact-name: cluster-container.spdx.json
          output-file: dist/cluster-container.spdx.json
          syft-version: v1.42.3
          upload-artifact: false
          upload-release-assets: false

      - name: Upload container references to release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.metadata.outputs.image }}
          TAG_NAME: ${{ needs.prepare-release.outputs.tag_name }}
          VERSION_BASE: ${{ steps.metadata.outputs.version_base }}
          BUILD_VERSION: ${{ steps.metadata.outputs.build_version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p dist
          {
            echo "image: ${IMAGE}"
            echo "tags:"
            echo "  - ${IMAGE}:${TAG_NAME}"
            echo "  - ${IMAGE}:${VERSION_BASE}"
            echo "  - ${IMAGE}:latest"
            echo "digest: ${DIGEST}"
            echo "version: ${BUILD_VERSION}"
          } > dist/cluster-container.txt

          for asset in dist/cluster-container.txt dist/cluster-container.spdx.json; do
            cosign sign-blob --yes --bundle "${asset}.sigstore.json" "${asset}"
          done

          gh release upload "$TAG_NAME" \
            dist/cluster-container.txt \
            dist/cluster-container.spdx.json \
            dist/cluster-container.txt.sigstore.json \
            dist/cluster-container.spdx.json.sigstore.json \
            --clobber
