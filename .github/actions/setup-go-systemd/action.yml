name: Verify systemd dependencies
description: Verify the native systemd build dependencies provided by the runner image.

runs:
  using: composite
  steps:
    - name: Verify systemd development packages
      shell: bash
      run: |
        dpkg-query --show --showformat='${Package} ${Version} ${db:Status-Abbrev}\n' pkg-config libsystemd-dev
        pkg-config --exists libsystemd
