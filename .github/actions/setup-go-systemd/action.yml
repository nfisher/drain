name: Setup Go and systemd dependencies
description: Set up Go, install systemd development dependencies, and download Go modules.

runs:
  using: composite
  steps:
    - name: Set up Go
      id: setup-go
      uses: actions/setup-go@v6
      with:
        go-version: "1.26.8"
        cache: false

    - name: Cache Go modules and build outputs
      uses: actions/cache@v5
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-
          ${{ runner.os }}-go-${{ runner.arch }}-

    - name: Install systemd development headers
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsystemd-dev pkg-config

    - name: Download dependencies
      shell: bash
      run: go mod download
