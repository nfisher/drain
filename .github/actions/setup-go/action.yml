name: Setup Go
description: Set up Go, restore the Go caches, and download modules.

runs:
  using: composite
  steps:
    - name: Set up Go
      id: setup-go
      uses: actions/setup-go@v6
      with:
        go-version: "1.26.8"
        cache: false

    - name: Cache Go modules and build outputs
      uses: actions/cache@v5
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: ${{ runner.os }}-go-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-
          ${{ runner.os }}-go-${{ runner.arch }}-

    - name: Download dependencies
      shell: bash
      run: go mod download
