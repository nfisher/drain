name: Setup Go
description: Set up Go, restore the Go caches, and download modules.

runs:
  using: composite
  steps:
    - name: Set up Go
      id: setup-go
      uses: actions/setup-go@v6
      with:
        go-version: "1.26.8"
        cache: false

    - name: Cache Go modules
      uses: actions/cache@v5
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-mod-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-mod-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-
          ${{ runner.os }}-go-mod-${{ runner.arch }}-

    - name: Cache Go build outputs
      uses: actions/cache@v5
      with:
        path: ~/.cache/go-build
        key: ${{ runner.os }}-go-build-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-cgo-${{ env.CGO_ENABLED || 'default' }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-build-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-cgo-${{ env.CGO_ENABLED || 'default' }}-
          ${{ runner.os }}-go-build-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-
          ${{ runner.os }}-go-build-${{ runner.arch }}-

    - name: Download dependencies
      shell: bash
      run: go mod download
